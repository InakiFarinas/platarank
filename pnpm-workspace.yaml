# postcss ships nested inside next with known advisories (build-time only); force the patched line.
overrides:
  postcss: ">=8.5.23"

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Pulled in by next-intl's own tooling, unused by the build; both ship prebuilt binaries, so their
# install scripts (a from-source fallback) are explicitly skipped instead of warned about.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
