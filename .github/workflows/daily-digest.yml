name: Daily Discord digest

on:
  schedule:
    - cron: "0 15 * * *" # 12:00 hora de Argentina
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm tsx scripts/daily-digest.ts
        env:
          # Read-only role once rotated; falls back to the old secret until then.
          DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY || secrets.DATABASE_URL }}
          DISCORD_DAILY_WEBHOOK: ${{ secrets.DISCORD_DAILY_WEBHOOK }}
