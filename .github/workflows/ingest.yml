name: Ingest AODP data

on:
  # Started every hour at :23 by the database, not by GitHub's own `schedule:`: GitHub's cron is best
  # effort and ran this "hourly" job about three times a day, even off minute 0. A pg_cron job in
  # Supabase (`ingest-hourly`) calls this workflow's workflow_dispatch with a fine-grained token
  # kept in Supabase Vault (`github_ingest_token`, Actions read/write on this repo only). It can
  # also be started by hand from the Actions tab.
  workflow_dispatch: {}

# Never two ingests at once (a manual run while the hourly one is still going): the second waits.
concurrency:
  group: ingest
  cancel-in-progress: false

# The job only needs to read the repository; nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (the tag in the comment is what they were at pin time).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      # No dependency lifecycle scripts: this job holds the database secret.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AODP_SERVER: west
          AODP_CONTACT: ${{ vars.AODP_CONTACT }}
      # Fresh prices are in: drop the site's shared market cache (and the pages built from it) so they
      # show up now instead of up to an hour later. Best effort: a failure here never fails the ingest,
      # the cache still expires on its own within the hour. Skipped until REVALIDATE_SECRET exists.
      - name: Refresh the site's market cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://platarank.vercel.app' }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then echo "REVALIDATE_SECRET not set; skipping."; exit 0; fi
          curl -sS --fail-with-body --max-time 30 -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" "$SITE_URL/api/revalidate" \
            || echo "::warning::Could not refresh the site's market cache; it expires on its own within the hour."
