name: Ingest AODP data

on:
  schedule:
    - cron: "0 * * * *" # cada hora
  workflow_dispatch: {}

# The job only needs to read the repository; nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (the tag in the comment is what they were at pin time).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      # No dependency lifecycle scripts: this job holds the database secret.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AODP_SERVER: west
          AODP_CONTACT: ${{ vars.AODP_CONTACT }}
